[project]
name = "ml-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.4",
    "matplotlib==3.11.2",
    "opencv-python==5.0.0.93",
    "torch==2.14.1",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "scikit-image==0.26.0",
    "lakefs==0.16.0",
    "lakefs_spec==0.15.1",
    "pyarrow==25.0.1",
    "fsspec==2026.9.0",
    "tqdm==4.70.1",
    "mlflow==3.17.2",
    "fastapi==0.158.1",
    "dotenv==0.9.9",
    "httpx==0.28.1",
    "podman==5.8.0",
    "uvicorn==0.54.0",
    "psycopg==3.3.6",
    "multiprocess==0.70.19"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "live_e2e: requires a running Compose stack and writes test state to LakeFS, MLflow, and PostgreSQL",
]
